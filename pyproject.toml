[project]
name = "batchlight-mcp"
version = "0.1.0"
description = "MCP server that lets AI assistants read and edit photos in Lightroom Classic, locally and privacy-first"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Ivan Gaton", email = "ivan@de-nos.com" }
]
requires-python = ">=3.13"
dependencies = [
    "httpx>=0.28.1",
    "mcp[cli]>=2.3.0",
    "pillow>=13.0.0",
    "starlette>=1.10.0",
    "uvicorn>=0.54.0",
]

[project.scripts]
batchlight-mcp = "batchlight_mcp:main"

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=8",
]

[tool.pytest.ini_options]
testpaths = ["tests/python"]
